<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilcharSec | Cybersecurity Learning Engine</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="manifest" href="/manifest.json" />
</head>
<body class="h-full font-sans antialiased text-gray-900 overflow-x-hidden">

    <!-- App Container -->
    <div id="app" class="flex flex-col min-h-screen">
        
        <!-- Navigation / Header -->
        <header id="main-header" class="bg-white border-b border-gray-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center gap-2">
                        <div class="bg-indigo-600 p-1.5 rounded-lg">
                            <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-gray-900">MilcharSec</span>
                    </div>
                    <nav class="flex items-center space-x-3 md:space-x-8 text-xs md:text-sm">
                        <a href="./" data-nav-dashboard class="text-xs md:text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Dashboard</a>
                        <a href="?modules" data-nav-modules class="text-xs md:text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 pb-5">Modules</a>
                        <a href="?tools" data-nav-tools class="text-xs md:text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Tools</a>
                    </nav>
                    <div class="flex items-center gap-4">
                        <div class="text-right hidden sm:block">
                            <p class="text-xs text-gray-500 font-medium">Awareness Score</p>
                            <p id="awareness-score-display" class="text-sm font-bold text-indigo-600">--/100</p>
                        </div>
                        <button class="bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition-colors" aria-label="Account">
                            <i data-lucide="user" class="w-5 h-5 text-gray-600"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-grow flex flex-col relative overflow-hidden">
            <!-- Loader -->
            <div id="loader" class="absolute inset-0 bg-white z-40 flex items-center justify-center transition-opacity duration-300">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                    <p class="text-sm text-gray-500 font-medium animate-pulse">Initializing learning engine...</p>
                </div>
            </div>

            <!-- Content Placeholder -->
            <div id="module-container" class="hidden flex-grow flex flex-col">
                <!-- Module Layout will be injected here -->
            </div>

            <!-- Assessment Placeholder (pre/post assessment flow) -->
            <div id="assessment-view" class="hidden flex-grow flex flex-col">
                <!-- Assessment shell will be injected here -->
            </div>

            <!-- Dashboard Placeholder (when no module is active) -->
            <div id="dashboard-view" class="hidden flex-grow max-w-7xl mx-auto w-full px-4 py-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">Learning Dashboard</h1>
                    <p class="text-gray-600">Select a module to continue your cybersecurity journey.</p>
                </div>
                
                <div id="module-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Module cards injected here -->
                </div>
            </div>
        </main>

        <!-- Global Toast Container -->
        <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>
    </div>

    <!-- Scripts -->
    <script src="modules/module-engine.js?v=20260831-2" type="module"></script>
    <script>
        document.addEventListener('click', (event) => {
            const dashboard = event.target.closest('[data-nav-dashboard]');
            if (dashboard) { event.preventDefault(); history.pushState({}, '', location.pathname); window.dispatchEvent(new PopStateEvent('popstate')); }
            const modules = event.target.closest('[data-nav-modules]');
            if (modules) { event.preventDefault(); history.pushState({}, '', '?modules'); window.dispatchEvent(new PopStateEvent('popstate')); }
            const tools = event.target.closest('[data-nav-tools]');
            if (tools) { event.preventDefault(); history.pushState({}, '', '?tools'); window.dispatchEvent(new PopStateEvent('popstate')); }
        });
        // Initialize Lucide icons on page load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
